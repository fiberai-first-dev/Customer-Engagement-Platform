# CEP — nginx (VM deploy)
# Frontend: https://cpi.logback-backend-services.online
# Backend:  https://cep-api.logback-backend-services.online
#
# Upstream apps (docker-compose on the VM):
#   platform-web  → 127.0.0.1:9000
#   platform-api  → 127.0.0.1:4100
#
# Install (Ubuntu):
#   sudo cp nginx-cep.conf /etc/nginx/sites-available/cep
#   sudo ln -sf /etc/nginx/sites-available/cep /etc/nginx/sites-enabled/cep
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (after DNS A/AAAA point here):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d cpi.logback-backend-services.online -d cep-api.logback-backend-services.online

upstream cep_web {
    server 127.0.0.1:9000;
    keepalive 16;
}

upstream cep_api {
    server 127.0.0.1:4100;
    keepalive 32;
}

# ---------- Frontend ----------
server {
    listen 80;
    listen [::]:80;
    server_name cpi.logback-backend-services.online;

    # certbot will upgrade this to HTTPS; keep HTTP→app until then
    location / {
        proxy_pass http://cep_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# ---------- Backend / API + webhooks ----------
server {
    listen 80;
    listen [::]:80;
    server_name cep-api.logback-backend-services.online;

    client_max_body_size 25m;

    # Health (optional public)
    location = /health {
        proxy_pass http://cep_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Meta / Google callbacks — must reach Fastify
    location /webhooks/ {
        proxy_pass http://cep_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Instagram Business Login OAuth
    location /oauth/ {
        proxy_pass http://cep_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /privacy {
        proxy_pass http://cep_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        proxy_pass http://cep_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Root / anything else on API host
    location / {
        proxy_pass http://cep_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
