name: cep-svasthyaa

services:
  cep-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cep
      POSTGRES_PASSWORD: cep
      POSTGRES_DB: cep_platform
    ports:
      - "5434:5432"
    volumes:
      - cep_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cep -d cep_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-api:
    build:
      context: ./apps/platform-api
      dockerfile: Dockerfile
    env_file:
      - ./apps/platform-api/.env
    environment:
      PLATFORM_API_BASE_URL: https://api.cep-svasthyaa.fybud.com
      PLATFORM_WEB_BASE_URL: https://cep-svasthyaa.fybud.com
      PLATFORM_DATABASE_URL: postgresql://cep:cep@cep-postgres:5432/cep_platform
      PLATFORM_MIGRATE_DATABASE_URL: postgresql://cep:cep@cep-postgres:5432/cep_platform
    ports:
      - "4100:4100"
    depends_on:
      cep-postgres:
        condition: service_healthy

  platform-web:
    build:
      context: ./apps/platform-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.cep-svasthyaa.fybud.com
    env_file:
      - ./apps/platform-web/.env
    ports:
      - "9000:5173"
    depends_on:
      - platform-api

volumes:
  cep_pg_data:
    name: cep-svasthyaa-pg-data
