services:
  cep-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cep
      POSTGRES_PASSWORD: cep
      POSTGRES_DB: cep_platform
    ports:
      - "5434:5432"
    volumes:
      - cep_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cep -d cep_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-api:
    build:
      context: .
      dockerfile: Dockerfile.platform-api
    environment:
      PLATFORM_DATABASE_URL: postgresql://cep:cep@cep-postgres:5432/cep_platform
      PLATFORM_PORT: "4100"
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:-dev-token-change-me}
      PLATFORM_PUBLIC_BASE_URL: ${PLATFORM_PUBLIC_BASE_URL:-http://localhost:4100}
    ports:
      - "4100:4100"
    depends_on:
      cep-postgres:
        condition: service_healthy

volumes:
  cep_pg_data:
