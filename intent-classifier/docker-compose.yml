services:
  intent-classifier:
    build: .
    ports:
      - "8091:8091"
    environment:
      HOST: "0.0.0.0"
      PORT: "8091"
      INTENT_MODEL_PATH: /app/models/intent_clf.joblib
    # Optional: override baked model with a host-trained one
    # volumes:
    #   - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
